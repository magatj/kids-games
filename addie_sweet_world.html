<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Addie's Sweet World 🍭</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at center, #ffb3e6 0%, #ff80cc 100%);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow: hidden;
  font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
}
canvas {
  display: block; border-radius: 14px;
  box-shadow: 0 0 60px rgba(255,120,200,0.7), 0 0 120px rgba(200,80,255,0.3);
  max-width: 100vw; max-height: 100vh;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';

// ─── CANVAS ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const BASE_W = 900, BASE_H = 560;
const GROUND_H = 70;
const GROUND_Y = BASE_H - GROUND_H;

function resize() {
  const s = Math.min(window.innerWidth/BASE_W, window.innerHeight/BASE_H, 1);
  canvas.width = BASE_W; canvas.height = BASE_H;
  canvas.style.width  = Math.floor(BASE_W*s)+'px';
  canvas.style.height = Math.floor(BASE_H*s)+'px';
}
resize(); window.addEventListener('resize', resize);

// ─── AUDIO ──────────────────────────────────────────────────────────────────
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

function tone(freq, type, dur, vol, delay) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type; o.frequency.value = freq;
  const t = audioCtx.currentTime + (delay||0);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.01);
}

function playSound(name) {
  if (!audioCtx) return;
  switch(name) {
    case 'catch':   tone(660,'sine',0.12,0.18); tone(880,'sine',0.1,0.14,0.07); tone(1100,'sine',0.08,0.1,0.13); break;
    case 'rainbow': [523,659,784,1047,1319].forEach((f,i)=>tone(f,'sine',0.25,0.12,i*0.07)); break;
    case 'magnet':  tone(660,'square',0.12,0.15); tone(880,'square',0.1,0.12,0.08); break;
    case 'hit':     tone(200,'sawtooth',0.3,0.25); tone(100,'sawtooth',0.2,0.15,0.1); break;
    case 'levelup': [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,'triangle',0.3,0.14,i*0.08)); break;
    case 'gameover':[440,330,220,165].forEach((f,i)=>tone(f,'sawtooth',0.35,0.18,i*0.14)); break;
  }
}

// ─── VOICE ──────────────────────────────────────────────────────────────────
let chosenVoice = null;
function loadVoice() {
  const vs = window.speechSynthesis.getVoices();
  if (!vs.length) return;
  chosenVoice =
    vs.find(v=>/aria|jenny|michelle|ana|emma/i.test(v.name)&&/online|natural|neural/i.test(v.name))||
    vs.find(v=>/microsoft/i.test(v.name)&&/online/i.test(v.name)&&/en/i.test(v.lang))||
    vs.find(v=>/zira|samantha|karen|moira|tessa|allison|ava|fiona/i.test(v.name))||
    vs.find(v=>/en[-_]/i.test(v.lang)&&!/david|mark|james|male/i.test(v.name))||null;
}
window.speechSynthesis.addEventListener('voiceschanged', loadVoice); loadVoice();

function speak(text, pitch, rate) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = pitch??1.3; u.rate = rate??0.92; u.volume = 1.0;
  if (chosenVoice) u.voice = chosenVoice;
  window.speechSynthesis.speak(u);
}

const SWEET_PHRASES = ['Yay so yummy!','More sweets!','Yay meow!','So delicious!','I love candy!'];
let speechCool = 0;
function saySweetPhrase() {
  if (speechCool>0) return;
  speak(SWEET_PHRASES[Math.floor(Math.random()*SWEET_PHRASES.length)],1.3,0.92);
  speechCool = 90;
}

// ─── BACKGROUND MUSIC ───────────────────────────────────────────────────────
let bgMusicOn = true, melodyIdx = 0, melodyTime = 0;
const MELODY = [523,659,784,659,523,659,784,880,784,659,523,659,587,659,784,659,
                523,659,523,392,440,523,659,523,587,659,784,880,1047,880,784,659,
                784,659,523,587,659,784,659,523,0,0,523,659,784,659,523,0];
const BEAT = 0.19;
function scheduleMelody() {
  if (!audioCtx||!bgMusicOn) return;
  const now = audioCtx.currentTime;
  if (melodyTime < now) melodyTime = now;
  while (melodyTime < now+1.2) {
    const f = MELODY[melodyIdx%MELODY.length];
    if (f>0) tone(f,'triangle',BEAT*0.78,0.045,melodyTime-now);
    melodyTime += BEAT; melodyIdx++;
  }
}
function toggleMusic() {
  bgMusicOn = !bgMusicOn;
  if (bgMusicOn) { initAudio(); melodyTime = audioCtx?audioCtx.currentTime:0; }
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
function rrect(x,y,w,h,r) {
  r = Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arc(x+w-r,y+r,r,-Math.PI/2,0);
  ctx.lineTo(x+w,y+h-r); ctx.arc(x+w-r,y+h-r,r,0,Math.PI/2);
  ctx.lineTo(x+r,y+h); ctx.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  ctx.lineTo(x,y+r); ctx.arc(x+r,y+r,r,Math.PI,-Math.PI/2);
  ctx.closePath();
}
function rectsOverlap(a,b) {
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function star5(x,y,outer,inner) {
  ctx.beginPath();
  for (let i=0;i<10;i++) {
    const r=i%2===0?outer:inner, a=i*Math.PI/5-Math.PI/2;
    if (i===0) ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));
    else ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));
  }
  ctx.closePath();
}

// ─── GAME STATE ─────────────────────────────────────────────────────────────
let state = 'start';
let score = 0, highScore = parseInt(localStorage.getItem('addieSweet')||'0');
let lives = 3, level = 1, frame = 0;
let hitCool = 0, lvlDisplay = 0, scoreNext = 300;

// ── PAUSE ────────────────────────────────────────────────────────────────────
let paused = false;
const PAUSE_BTN = { x: BASE_W - 108, y: 6, w: 96, h: 32 };

function pauseBtnHit(cx, cy) {
  return cx >= PAUSE_BTN.x && cx <= PAUSE_BTN.x + PAUSE_BTN.w &&
         cy >= PAUSE_BTN.y && cy <= PAUSE_BTN.y + PAUSE_BTN.h;
}

function togglePause() {
  if (state !== 'playing') return;
  paused = !paused;
}

document.addEventListener('keydown', (e) => {
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'playing') {
    e.preventDefault();
    togglePause();
  }
});

// ─── PARTICLES ──────────────────────────────────────────────────────────────
let particles = [];
const CANDY_COLS = ['#ff6b9d','#ff9ff3','#c56bff','#ffb3e6','#ff6b6b','#ffd93d','#ff9f43','#a29bfe','#ffeaa7'];

function spawnParticle(x,y,type,n) {
  n=n||1;
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, spd=1+Math.random()*6;
    const col = type==='sweet'?CANDY_COLS[Math.floor(Math.random()*CANDY_COLS.length)]:
                type==='rainbow'?`hsl(${Math.random()*360},100%,65%)`:
                type==='hit'?`hsl(${Math.random()*30},100%,55%)`:`hsl(${Math.random()*360},100%,70%)`;
    const shapes=['circle','star','heart','diamond'];
    particles.push({
      x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-3,
      life:1, decay:0.02+Math.random()*0.02,
      size:3+Math.random()*8, col,
      shape:type==='sweet'?shapes[Math.floor(Math.random()*shapes.length)]:'circle',
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.2
    });
  }
}

function updateParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.97;
    p.life-=p.decay; p.rot+=p.rotV;
    if (p.life<=0) particles.splice(i,1);
  }
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    switch(p.shape) {
      case 'star': star5(0,0,p.size,p.size*0.42); ctx.fill(); break;
      case 'heart':
        ctx.beginPath(); ctx.arc(-p.size*0.3,-p.size*0.1,p.size*0.35,0,Math.PI*2);
        ctx.arc(p.size*0.3,-p.size*0.1,p.size*0.35,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-p.size*0.65,-p.size*0.1); ctx.lineTo(0,p.size*0.65);
        ctx.lineTo(p.size*0.65,-p.size*0.1); ctx.fill(); break;
      case 'diamond':
        ctx.beginPath(); ctx.moveTo(0,-p.size); ctx.lineTo(p.size*0.6,0);
        ctx.lineTo(0,p.size); ctx.lineTo(-p.size*0.6,0); ctx.closePath(); ctx.fill(); break;
      default: ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

// ─── SCORE POPUPS ───────────────────────────────────────────────────────────
let popups = [];
function addPopup(x,y,text,col) { popups.push({x,y,text,col,life:1}); }
function updateDrawPopups() {
  for (let i=popups.length-1;i>=0;i--) {
    const p=popups[i]; p.y-=1.5; p.life-=0.022;
    if (p.life<=0){popups.splice(i,1);continue;}
    ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.col;
    ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=4;
    ctx.fillText(p.text,p.x,p.y); ctx.restore();
  }
}

// ─── BACKGROUND ─────────────────────────────────────────────────────────────
const bgClouds = Array.from({length:7},()=>({
  x:Math.random()*BASE_W, y:30+Math.random()*120,
  w:100+Math.random()*120, spd:0.25+Math.random()*0.3, a:0.55+Math.random()*0.4
}));
const bgHearts = Array.from({length:12},()=>({
  x:Math.random()*BASE_W, y:Math.random()*GROUND_Y*0.8,
  size:6+Math.random()*10, spd:0.1+Math.random()*0.2,
  tw:Math.random()*Math.PI*2, col:`hsl(${300+Math.random()*70},80%,${68+Math.random()*16}%)`
}));

function drawBackground() {
  const sky=ctx.createLinearGradient(0,0,0,BASE_H);
  sky.addColorStop(0,'#ffe0f7'); sky.addColorStop(0.4,'#ffd0f0');
  sky.addColorStop(0.75,'#ffc8ea'); sky.addColorStop(1,'#ffb0e0');
  ctx.fillStyle=sky; ctx.fillRect(0,0,BASE_W,BASE_H);

  // Faint background title
  ctx.save(); ctx.textAlign='center';
  ctx.font='bold italic 60px "Comic Sans MS",cursive';
  ctx.fillStyle=`rgba(200,60,160,${0.05+Math.sin(frame*0.016)*0.02})`;
  ctx.fillText("Addie's Sweet World", BASE_W/2, BASE_H*0.32);
  ctx.restore();

  // Floating hearts (ambient, slow drift)
  bgHearts.forEach(h=>{
    h.x -= h.spd; h.tw += 0.035;
    if (h.x < -20) { h.x = BASE_W+20; h.y = Math.random()*GROUND_Y*0.8; }
    ctx.save(); ctx.globalAlpha=0.14+Math.sin(h.tw)*0.07; ctx.fillStyle=h.col;
    ctx.translate(h.x, h.y+Math.sin(h.tw*0.5)*5);
    ctx.beginPath();
    ctx.arc(-h.size*0.3,-h.size*0.1,h.size*0.35,0,Math.PI*2);
    ctx.arc(h.size*0.3,-h.size*0.1,h.size*0.35,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-h.size*0.65,-h.size*0.1); ctx.lineTo(0,h.size*0.65);
    ctx.lineTo(h.size*0.65,-h.size*0.1); ctx.fill();
    ctx.restore();
  });

  // Clouds
  bgClouds.forEach(c=>{
    c.x -= c.spd;
    if (c.x+c.w<0){c.x=BASE_W+c.w; c.y=30+Math.random()*120;}
    ctx.fillStyle=`rgba(255,245,255,${c.a})`;
    ctx.beginPath();
    ctx.arc(c.x+c.w*0.26,c.y+18,c.w*0.22,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.49,c.y+8, c.w*0.28,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.73,c.y+18,c.w*0.22,0,Math.PI*2);
    ctx.fill();
  });

  // Ground
  const grd=ctx.createLinearGradient(0,GROUND_Y,0,BASE_H);
  grd.addColorStop(0,'#88dd38'); grd.addColorStop(0.3,'#60c020'); grd.addColorStop(1,'#408010');
  ctx.fillStyle=grd; ctx.fillRect(0,GROUND_Y,BASE_W,GROUND_H);
  ctx.fillStyle='#9aea4a'; ctx.fillRect(0,GROUND_Y,BASE_W,6);

  // Static ground flowers
  const petCols=['#ff6b9d','#ff9f43','#a29bfe','#ffd93d','#ff6b6b','#55efc4'];
  for (let fx=30;fx<BASE_W;fx+=65) {
    ctx.strokeStyle='#50a030'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx,GROUND_Y+4); ctx.lineTo(fx,GROUND_Y-14); ctx.stroke();
    const pc=petCols[Math.floor(fx/65)%petCols.length];
    for (let p=0;p<5;p++) {
      const pa=p*Math.PI*2/5+frame*0.01;
      ctx.fillStyle=pc;
      ctx.beginPath(); ctx.ellipse(fx+Math.cos(pa)*6,GROUND_Y-14+Math.sin(pa)*6,4,3,pa,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(fx,GROUND_Y-14,3.5,0,Math.PI*2); ctx.fill();
  }
}

// ─── DRAW PRINCESS ──────────────────────────────────────────────────────────
function drawPrincess(x, y, lp, rainbow, moving) {
  ctx.save();
  if (rainbow){ctx.shadowColor=`hsl(${frame*4%360},100%,65%)`;ctx.shadowBlur=22;}
  if (hitCool>0&&Math.floor(hitCool/5)%2===1) ctx.globalAlpha=0.25;

  ctx.translate(x+40,y+52); ctx.rotate(moving*0.07); ctx.translate(-40,-52);

  const ht=frame*0.042;
  const hc=rainbow?`hsl(${frame*3%360},100%,78%)`:'#ffb3d9';
  const hc2=rainbow?`hsl(${(frame*3+55)%360},100%,82%)`:'#ff8ec4';

  // BACK HAIR
  [[hc,9],[hc2,5.5]].forEach(([col,lw],i)=>{
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+36,y+13);
    ctx.bezierCurveTo(x+18+Math.sin(ht+i)*4,y+34,x+7+Math.sin(ht+i*.7)*5,y+60,x+11+Math.sin(ht+i*.5)*6,y+84-i*3);
    ctx.stroke();
  });
  ctx.strokeStyle='rgba(255,180,215,0.55)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(x+29,y+15);
  ctx.bezierCurveTo(x+14+Math.sin(ht)*3,y+42,x+4+Math.sin(ht*.8)*5,y+66,x+7,y+90); ctx.stroke();

  // SKIRT
  const sw=Math.sin(lp*.5)*4;
  const sg=ctx.createLinearGradient(x,y+57,x+80,y+98);
  if (rainbow){sg.addColorStop(0,`hsl(${frame*3%360},80%,78%)`);sg.addColorStop(.5,`hsl(${(frame*3+120)%360},80%,68%)`);sg.addColorStop(1,`hsl(${(frame*3+240)%360},80%,58%)`);}
  else{sg.addColorStop(0,'#ff99cc');sg.addColorStop(.4,'#ff55aa');sg.addColorStop(1,'#cc2299');}
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.moveTo(x+26,y+58);
  ctx.bezierCurveTo(x-6+sw,y+72,x-11+sw,y+89,x+2,y+98);
  ctx.lineTo(x+78,y+98);
  ctx.bezierCurveTo(x+91+sw,y+89,x+86+sw,y+72,x+54,y+58);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=rainbow?`hsla(${(frame*3+70)%360},80%,88%,.42)`:'rgba(255,185,228,.38)';
  ctx.beginPath(); ctx.moveTo(x+29,y+63);
  ctx.bezierCurveTo(x+9,y+74,x+11,y+89,x+23,y+98);
  ctx.lineTo(x+57,y+98); ctx.bezierCurveTo(x+69,y+89,x+71,y+74,x+51,y+63); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=rainbow?`hsl(${frame*4%360},100%,84%)`:'rgba(255,225,242,.88)';
  ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x+2,y+98); ctx.bezierCurveTo(x+30,y+91,x+50,y+91,x+78,y+98); ctx.stroke();
  ctx.setLineDash([]);

  // BODICE
  const bg=ctx.createLinearGradient(x+26,y+41,x+54,y+59);
  if (rainbow){bg.addColorStop(0,`hsl(${(frame*3+185)%360},80%,66%)`);bg.addColorStop(1,`hsl(${(frame*3+245)%360},80%,55%)`);}
  else{bg.addColorStop(0,'#cc55ff');bg.addColorStop(1,'#9922ee');}
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.moveTo(x+26,y+58); ctx.lineTo(x+54,y+58);
  ctx.lineTo(x+49,y+41); ctx.lineTo(x+31,y+41); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffbb00'; ctx.shadowBlur=7;
  ctx.beginPath(); ctx.arc(x+40,y+49,3.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;

  // ARMS (held up in catching pose)
  const asw=Math.sin(lp)*8;
  ctx.strokeStyle='#ffdcc0'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+27,y+45); ctx.lineTo(x+10-asw,y+30+Math.cos(lp)*3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+53,y+45); ctx.lineTo(x+70+asw,y+30+Math.cos(lp)*3); ctx.stroke();
  ctx.fillStyle='#ffdcc0';
  ctx.beginPath(); ctx.arc(x+10-asw,y+31+Math.cos(lp)*3,4.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+70+asw,y+31+Math.cos(lp)*3,4.5,0,Math.PI*2); ctx.fill();

  // NECK + HEAD
  ctx.fillStyle='#ffdcc0'; ctx.beginPath(); ctx.roundRect(x+35,y+37,10,7,4); ctx.fill();
  const hg=ctx.createRadialGradient(x+40,y+21,3,x+40,y+21,19);
  hg.addColorStop(0,'#fff6ea'); hg.addColorStop(1,'#ffdcc0');
  ctx.fillStyle=hg; ctx.strokeStyle='#f0c0a0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x+40,y+21,19,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // FRONT HAIR
  ctx.fillStyle=hc;
  ctx.beginPath(); ctx.arc(x+40,y+6,16,Math.PI+.35,2*Math.PI-.35); ctx.fill();
  ctx.beginPath(); ctx.arc(x+23,y+19,8,0.6,Math.PI*1.9); ctx.fill();
  ctx.beginPath(); ctx.arc(x+57,y+19,8,-.1,Math.PI-.4); ctx.fill();

  // EYES
  [[x+32,x+48]].flat().forEach((ex,i)=>{
    const eyeX=(i===0)?x+32:x+48;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(eyeX,y+21,5.5,6.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4a1866'; ctx.beginPath(); ctx.arc(eyeX,y+22,4.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7b40b0'; ctx.beginPath(); ctx.arc(eyeX,y+22,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(eyeX+1.5,y+20.5,1.7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2a0840'; ctx.lineWidth=1.3;
    const lBase=i===0?[eyeX-6,eyeX-3.5,eyeX-1]:[eyeX-1,eyeX+2,eyeX+5];
    lBase.forEach(lx=>{ ctx.beginPath(); ctx.moveTo(lx,y+15); ctx.lineTo(lx+(i===0?-1:1),y+12); ctx.stroke(); });
  });

  // CHEEKS + NOSE + SMILE
  ctx.fillStyle='rgba(255,135,150,.28)';
  ctx.beginPath(); ctx.ellipse(x+27,y+28,7,4.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+53,y+28,7,4.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8a080'; ctx.beginPath(); ctx.arc(x+40,y+27,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc6080'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x+40,y+31,6,.2,Math.PI-.2); ctx.stroke();

  // CROWN
  const cg=ctx.createLinearGradient(x+20,y-15,x+60,y+3);
  cg.addColorStop(0,rainbow?`hsl(${frame*5%360},100%,74%)`:'#ffd700');
  cg.addColorStop(.5,'#fff6a0');
  cg.addColorStop(1,rainbow?`hsl(${(frame*5+130)%360},100%,74%)`:'#ffaa00');
  ctx.fillStyle=cg; ctx.strokeStyle='#cc8800'; ctx.lineWidth=1.5;
  ctx.beginPath(); rrect(x+20,y-2,40,9,4); ctx.fill(); ctx.stroke();
  [[x+37,y-2,x+40,y-19,x+43,y-2],[x+22,y-2,x+26,y-13,x+30,y-2],[x+50,y-2,x+54,y-13,x+58,y-2]].forEach(pts=>{
    ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); ctx.lineTo(pts[2],pts[3]); ctx.lineTo(pts[4],pts[5]);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  [[x+40,y-15,'#ff44aa'],[x+26,y-10,'#44aaff'],[x+54,y-10,'#44ff99']].forEach(([gx,gy,gc])=>{
    ctx.fillStyle=gc; ctx.shadowColor=gc; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(gx,gy,3.5,0,Math.PI*2); ctx.fill();
  });
  ctx.shadowBlur=0;

  // LEGS
  const ls=Math.sin(lp)*7;
  ctx.fillStyle='#ffdcc0'; ctx.strokeStyle='#f0c0a0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x+40+ls*.4,y+89,10,10,3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x+28-ls*.4,y+89,10,10,3); ctx.fill(); ctx.stroke();
  const sc=rainbow?`hsl(${frame*4%360},100%,68%)`:'#dd44aa';
  ctx.fillStyle=sc; ctx.strokeStyle='#aa2288'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(x+46+ls*.4,y+97,9,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x+33-ls*.4,y+97,9,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();

  ctx.restore();
}

// ─── DRAW CAT ───────────────────────────────────────────────────────────────
function drawCat(x, y, lp, rainbow, happy) {
  ctx.save();
  if (rainbow){ctx.shadowColor=`hsl(${(frame*4+130)%360},100%,65%)`;ctx.shadowBlur=14;}

  const ls=Math.sin(lp)*7;
  const tailSw=happy?Math.sin(frame*.3)*22:Math.sin(lp*.5)*14;

  // TAIL
  ctx.strokeStyle=rainbow?`hsl(${frame*3%360},100%,84%)`:'#f8e8d8';
  ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+8,y+28);
  ctx.bezierCurveTo(x-12+Math.sin(tailSw*.07)*9,y+13,x-17,y-9+Math.cos(tailSw*.05)*6,x-2,y-19); ctx.stroke();
  ctx.fillStyle=rainbow?`hsl(${(frame*3+65)%360},100%,82%)`:'#eedad0';
  ctx.beginPath(); ctx.arc(x-2,y-19,5.5,0,Math.PI*2); ctx.fill();

  // BODY
  ctx.fillStyle=rainbow?`hsl(${(frame*3+185)%360},45%,93%)`:'#fff8f2';
  ctx.strokeStyle='#e8d0c0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(x+25,y+28,21,16,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,248,242,.82)';
  ctx.beginPath(); ctx.ellipse(x+25,y+30,13,10,0,0,Math.PI*2); ctx.fill();

  // LEGS
  ctx.fillStyle='#fff8f2'; ctx.strokeStyle='#e8d0c0'; ctx.lineWidth=1.2;
  [[x+30+ls,y+40],[x+22-ls*.5,y+40],[x+16+ls*.5,y+40],[x+8-ls,y+40]].forEach(([lx,ly])=>{
    ctx.beginPath(); ctx.roundRect(lx,ly,6,10,3); ctx.fill(); ctx.stroke();
  });
  ctx.fillStyle='#ffd5ba';
  [[x+33+ls,y+49],[x+25-ls*.5,y+49],[x+19+ls*.5,y+49],[x+11-ls,y+49]].forEach(([px,py])=>{
    ctx.beginPath(); ctx.ellipse(px,py,4.5,3,0,0,Math.PI*2); ctx.fill();
  });

  // HEAD
  ctx.fillStyle='#fff8f2'; ctx.strokeStyle='#e8d0c0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x+33,y+13,15,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // EARS
  [[x+20,y+3,x+22,y-11,x+29,y+2],[x+37,y+3,x+42,y-11,x+46,y+2]].forEach((pts,i)=>{
    ctx.fillStyle='#fff8f2'; ctx.strokeStyle='#e8d0c0'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); ctx.lineTo(pts[2],pts[3]); ctx.lineTo(pts[4],pts[5]); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffccdd';
    const dx=i===0?1.5:1;
    ctx.beginPath(); ctx.moveTo(pts[0]+dx,pts[1]); ctx.lineTo(pts[2],pts[3]+2); ctx.lineTo(pts[4]-dx,pts[5]); ctx.closePath(); ctx.fill();
  });

  // EYES
  [[x+27,y+13],[x+38,y+13]].forEach(([ex,ey])=>{
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,5,5.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rainbow?`hsl(${frame*3%360},80%,42%)`:'#2a7850';
    ctx.beginPath(); ctx.arc(ex,ey,3.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(ex+1,ey-1,1.4,0,Math.PI*2); ctx.fill();
  });
  if (happy) {
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.2;
    [[x+27,y+13],[x+38,y+13]].forEach(([ex,ey])=>{
      for (let s=0;s<4;s++) {
        const sa=s*Math.PI/2+frame*0.22;
        ctx.beginPath(); ctx.moveTo(ex+Math.cos(sa)*5,ey+Math.sin(sa)*5);
        ctx.lineTo(ex+Math.cos(sa)*9,ey+Math.sin(sa)*9); ctx.stroke();
      }
    });
  }

  // NOSE + WHISKERS + SMILE
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath(); ctx.moveTo(x+32,y+19); ctx.lineTo(x+33.5,y+17); ctx.lineTo(x+35,y+19); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(100,80,60,.42)'; ctx.lineWidth=.9;
  [[x+32,y+20,x+18,y+17],[x+32,y+21,x+18,y+21],[x+32,y+22,x+18,y+25],
   [x+34,y+20,x+48,y+17],[x+34,y+21,x+48,y+21],[x+34,y+22,x+48,y+25]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  ctx.strokeStyle='#ff9999'; ctx.lineWidth=1.3; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x+30,y+22.5,2.2,0,Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+36,y+22.5,2.2,0,Math.PI); ctx.stroke();
  ctx.restore();
}

// ─── INPUT ──────────────────────────────────────────────────────────────────
const keysHeld = {left:false, right:false};

document.addEventListener('keydown', e=>{
  if (e.code==='KeyM') { initAudio(); toggleMusic(); return; }
  if (paused) return; // ignore movement input while paused
  if (/ArrowLeft|KeyA/.test(e.code))  { e.preventDefault(); keysHeld.left=true; }
  if (/ArrowRight|KeyD/.test(e.code)) { e.preventDefault(); keysHeld.right=true; }
  if (/Space|ArrowUp/.test(e.code)) {
    e.preventDefault(); initAudio();
    if (state!=='playing') startGame();
  }
});
document.addEventListener('keyup', e=>{
  if (/ArrowLeft|KeyA/.test(e.code))  keysHeld.left=false;
  if (/ArrowRight|KeyD/.test(e.code)) keysHeld.right=false;
});

function getTouchSide(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = BASE_W / rect.width;
  const sides = {left:false, right:false};
  for (const t of e.touches) {
    const tx = (t.clientX - rect.left) * scaleX;
    if (tx < BASE_W/2) sides.left = true;
    else sides.right = true;
  }
  return sides;
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault(); initAudio();
  if (state !== 'playing') { startGame(); return; }
  if (paused) return;
  const s = getTouchSide(e); keysHeld.left=s.left; keysHeld.right=s.right;
}, {passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if (state !== 'playing' || paused) return;
  const s = getTouchSide(e); keysHeld.left=s.left; keysHeld.right=s.right;
}, {passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if (state !== 'playing') return;
  if (e.touches.length === 0) { keysHeld.left=false; keysHeld.right=false; return; }
  const s = getTouchSide(e); keysHeld.left=s.left; keysHeld.right=s.right;
}, {passive:false});

canvas.addEventListener('click', (e)=>{
  initAudio();
  if (state !== 'playing') { startGame(); return; }
  const rect = canvas.getBoundingClientRect();
  const scaleX = BASE_W / rect.width;
  const scaleY = BASE_H / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  if (pauseBtnHit(cx, cy)) { togglePause(); }
});

// ─── PRINCESS OBJECT ────────────────────────────────────────────────────────
const PRINCESS = {
  x: BASE_W/2 - 40, y: GROUND_Y - 98,
  w: 80, h: 98,
  moveSpeed: 6,
  rainbow: false, rainbowTimer: 0,
  magnet: false, magnetTimer: 0,
  legPhase: 0, moving: 0,

  reset() {
    this.x = BASE_W/2 - 40;
    this.y = GROUND_Y - this.h;
    this.rainbow = false; this.rainbowTimer = 0;
    this.magnet = false; this.magnetTimer = 0;
    this.moving = 0;
  },

  update() {
    const spd = this.moveSpeed + level * 0.4;
    this.moving = 0;
    if (keysHeld.left  && this.x > 10)              { this.x -= spd; this.moving = -1; }
    if (keysHeld.right && this.x < BASE_W-this.w-10){ this.x += spd; this.moving =  1; }
    this.legPhase += this.moving !== 0 ? 0.24 : 0.05;
    if (this.rainbow) { this.rainbowTimer--; if(this.rainbowTimer<=0) this.rainbow=false;
      if(frame%2===0) spawnParticle(this.x+Math.random()*this.w, this.y+Math.random()*this.h, 'rainbow'); }
    if (this.magnet)  { this.magnetTimer--;  if(this.magnetTimer<=0)  this.magnet=false;
      if(frame%4===0) spawnParticle(this.x+Math.random()*this.w, this.y+Math.random()*this.h, 'hit', 1); }
    if (speechCool>0) speechCool--;
  },

  getHitbox() { return {x:this.x+6, y:this.y, w:this.w-12, h:this.h-10}; },

  draw() {
    // Magnet ring
    if (this.magnet) {
      ctx.save();
      ctx.strokeStyle=`hsl(${frame*8%360},100%,55%)`; ctx.lineWidth=3;
      ctx.globalAlpha=0.5+Math.sin(frame*.25)*0.25;
      ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+this.h/2, 58+Math.sin(frame*.15)*6, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    drawPrincess(this.x, this.y, this.legPhase, this.rainbow, this.moving);
  }
};

// ─── CAT OBJECT ─────────────────────────────────────────────────────────────
const CAT = {
  x: 0, y: GROUND_Y - 50,
  w: 50, h: 50,
  legPhase: 0, happy: 0, dir: 1,

  reset() {
    this.x = PRINCESS.x + 100;
    this.y = GROUND_Y - this.h;
    this.happy = 0; this.dir = 1;
  },

  celebrate() { this.happy = 45; },

  update() {
    // Loosely follow princess with a gap
    const targetX = PRINCESS.x + 110;
    const dx = targetX - this.x;
    if (Math.abs(dx) > 8) { this.x += dx * 0.05; this.dir = dx > 0 ? 1 : -1; }
    this.x = Math.max(5, Math.min(BASE_W - this.w - 5, this.x));
    this.legPhase += 0.22;
    if (this.happy > 0) this.happy--;
  },

  draw() { drawCat(this.x, this.y, this.legPhase, PRINCESS.rainbow, this.happy > 0); }
};

// ─── FALLING ITEMS ──────────────────────────────────────────────────────────
const MAGNET_DUR  = 240;
const RAINBOW_DUR = 300;

const ITEM_DEFS = [
  {type:'choc',   pts:10, wt:0.26, emoji:'🍫', col:'#c0680a', bad:false},
  {type:'candy',  pts:15, wt:0.22, emoji:'🍬', col:'#ff44aa', bad:false},
  {type:'lolly',  pts:20, wt:0.18, emoji:'🍭', col:'#ff66cc', bad:false},
  {type:'cupcake',pts:25, wt:0.10, emoji:'🧁', col:'#cc44ee', bad:false},
  {type:'donut',  pts:15, wt:0.07, emoji:'🍩', col:'#e87830', bad:false},
  {type:'cake',   pts:30, wt:0.04, emoji:'🍰', col:'#ff88bb', bad:false},
  {type:'magnet', pts:0,  wt:0.03, emoji:'🧲', col:'#ff2222', bad:false},
  {type:'rainbow',pts:50, wt:0.02, emoji:'🌈', col:'#ffd700', bad:false},
  {type:'bee',    pts:0,  wt:0.08, emoji:'🐝', col:'#ff4400', bad:true},
];
const TOTAL_WT = ITEM_DEFS.reduce((s,t)=>s+t.wt, 0);

let items = [], itemTimer = 0, itemInterval = 60;

function spawnItem() {
  const r = Math.random() * TOTAL_WT;
  let cum = 0, def = ITEM_DEFS[0];
  for (const d of ITEM_DEFS) { cum += d.wt; if (r < cum) { def = d; break; } }
  const x = 30 + Math.random() * (BASE_W - 80);
  items.push({
    ...def,
    x, y: -45, iw: 38, ih: 38,
    speed: 2.5 + level * 0.3 + Math.random() * 0.8,
    wobble: def.bad ? 0.04 + Math.random()*0.04 : 0,
    wPhase: Math.random() * Math.PI * 2,
    spin: Math.random() * Math.PI * 2
  });
}

function updateItems() {
  // Spawn
  itemTimer++;
  if (itemTimer >= itemInterval) {
    itemTimer = 0;
    itemInterval = Math.max(32, 60 - level * 4);
    spawnItem();
    if (Math.random() < 0.25) setTimeout(spawnItem, 350);
  }

  const hb = PRINCESS.getHitbox();

  for (let i = items.length-1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed;
    it.spin += 0.06;

    // Bees wobble sideways
    if (it.bad) {
      it.wPhase += it.wobble * 60;
      it.x += Math.sin(it.wPhase) * 1.8;
      it.x = Math.max(5, Math.min(BASE_W - it.iw - 5, it.x));
    }

    // Magnet pull
    if (PRINCESS.magnet && !it.bad) {
      const cx = it.x+it.iw/2, cy = it.y+it.ih/2;
      const pcx = PRINCESS.x+PRINCESS.w/2, pcy = PRINCESS.y+PRINCESS.h/2;
      const dx = pcx-cx, dy = pcy-cy, dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < 220 && dist > 1) { const pull = 6*(1-dist/220); it.x += dx/dist*pull; it.y += dy/dist*pull; }
    }

    // Collision check
    const ib = {x:it.x+5, y:it.y+5, w:it.iw-10, h:it.ih-10};
    if (rectsOverlap(hb, ib)) {
      if (it.bad && !PRINCESS.rainbow) {
        lives--; hitCool = 110;
        spawnParticle(it.x+it.iw/2, it.y+it.ih/2, 'hit', 22);
        playSound('hit');
        speak('Ouch! Watch out for bees!', 1.3, 0.9);
        if (lives <= 0) {
          state = 'gameover';
          if (score > highScore) { highScore = score; localStorage.setItem('addieSweet', highScore); }
          playSound('gameover');
        }
      } else if (!it.bad) {
        const mul = PRINCESS.rainbow ? 2 : 1;
        score += it.pts * mul;
        spawnParticle(it.x+it.iw/2, it.y+it.ih/2, 'sweet', 18);
        if (it.pts > 0) addPopup(it.x+it.iw/2, it.y, `+${it.pts*mul}`, it.col);
        CAT.celebrate();
        if (it.type === 'rainbow') {
          PRINCESS.rainbow = true; PRINCESS.rainbowTimer = RAINBOW_DUR;
          spawnParticle(it.x+it.iw/2, it.y+it.ih/2, 'rainbow', 35);
          playSound('rainbow'); speak('Rainbow magic! Double points!', 1.3, 0.9);
        } else if (it.type === 'magnet') {
          PRINCESS.magnet = true; PRINCESS.magnetTimer = MAGNET_DUR;
          addPopup(it.x+it.iw/2, it.y, '🧲 MAGNET!', '#ff2222');
          playSound('magnet'); speak('Magnet power! Come to me sweets!', 1.3, 0.9);
        } else {
          playSound('catch'); saySweetPhrase();
        }
        if (score >= scoreNext) {
          level++; scoreNext = score + 300 + level*120; lvlDisplay = 90;
          for (let k=0;k<55;k++) spawnParticle(Math.random()*BASE_W, Math.random()*BASE_H*0.7, 'sweet');
          playSound('levelup');
        }
      }
      items.splice(i, 1);
      continue;
    }

    // Off bottom — just remove (no penalty for missing sweets = less frustrating for kids)
    if (it.y > BASE_H + 10) items.splice(i, 1);
  }
}

function drawItems() {
  items.forEach(it=>{
    ctx.save();
    const cx = it.x+it.iw/2, cy = it.y+it.ih/2;

    // Drop shadow on ground — shows where item will land
    const shadowY = GROUND_Y - 4;
    const dist = Math.max(0, shadowY - cy);
    const shadowAlpha = Math.max(0, 0.22 - dist/800);
    const shadowScale = Math.max(0.1, 1 - dist/500);
    if (shadowAlpha > 0.01) {
      ctx.globalAlpha = shadowAlpha;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(cx, shadowY, 18*shadowScale, 5*shadowScale, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bee warning glow when close to princess level
    if (it.bad && it.y > PRINCESS.y - 120) {
      ctx.globalAlpha = 0.3 + Math.sin(frame*0.3)*0.2;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Gentle bob/spin for sweets
    const bob = it.bad ? 0 : Math.sin(it.spin) * 3;
    ctx.translate(cx, cy + bob);
    if (!it.bad) ctx.rotate(Math.sin(it.spin*0.5)*0.15);
    ctx.shadowColor = it.bad ? '#ff2200' : it.col;
    ctx.shadowBlur = it.bad ? 14 : 10;
    ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  });
}

// ─── HUD ────────────────────────────────────────────────────────────────────
function drawHUD() {
  ctx.save();

  // Score
  ctx.font='bold 30px Arial'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.97)';
  ctx.shadowColor='rgba(200,50,150,.8)'; ctx.shadowBlur=10;
  ctx.fillText(`🍭 ${score}`, 18, 40); ctx.shadowBlur=0;
  ctx.font='bold 16px Arial'; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(`Level ${level}`, 18, 62);
  ctx.font='bold 14px Arial'; ctx.fillStyle='#ffd700'; ctx.fillText(`Best: ${highScore}`, 18, 82);

  // Lives (hearts)
  for (let i=0;i<3;i++) {
    ctx.fillStyle = i<lives ? '#ff3875' : 'rgba(255,80,100,.22)';
    ctx.font='30px Arial'; ctx.textAlign='right';
    ctx.fillText('♥', BASE_W-18-i*36, 40);
  }

  // Power-up bars
  let barY = 10;
  if (PRINCESS.rainbow) {
    const bw=160,bh=14,bx=BASE_W/2-bw/2,by=barY;
    ctx.fillStyle='rgba(0,0,0,.32)'; rrect(bx-2,by-2,bw+4,bh+4,6); ctx.fill();
    const rg=ctx.createLinearGradient(bx,by,bx+bw,by);
    for(let i=0;i<=6;i++) rg.addColorStop(i/6,`hsl(${i*60},100%,65%)`);
    ctx.fillStyle=rg; rrect(bx,by,bw*(PRINCESS.rainbowTimer/RAINBOW_DUR),bh,5); ctx.fill();
    ctx.fillStyle='white'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText('🌈 RAINBOW MAGIC! 2× POINTS',BASE_W/2,by+11);
    barY += 20;
  }
  if (PRINCESS.magnet) {
    const bw=160,bh=14,bx=BASE_W/2-bw/2,by=barY;
    ctx.fillStyle='rgba(0,0,0,.32)'; rrect(bx-2,by-2,bw+4,bh+4,6); ctx.fill();
    const mg=ctx.createLinearGradient(bx,by,bx+bw,by);
    mg.addColorStop(0,'#ff2222'); mg.addColorStop(0.5,'#ff8888'); mg.addColorStop(1,'#ff2222');
    ctx.fillStyle=mg; rrect(bx,by,bw*(PRINCESS.magnetTimer/MAGNET_DUR),bh,5); ctx.fill();
    ctx.fillStyle='white'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText('🧲 MAGNET POWER!',BASE_W/2,by+11);
  }

  // Music indicator
  ctx.textAlign='right'; ctx.font='bold 14px Arial'; ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText(bgMusicOn?'🎵 M':'🔇 M', BASE_W-16, 82);

  // Pause button (top-right)
  const pb = PAUSE_BTN;
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = paused ? '#cc44ee' : '#ff66bb';
  rrect(pb.x, pb.y, pb.w, pb.h, 10); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'white';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(paused ? '▶ Resume' : '⏸ Pause', pb.x + pb.w / 2, pb.y + pb.h / 2);
  ctx.textBaseline = 'alphabetic';

  // On-screen arrow buttons (always shown during play)
  const btnW=90, btnH=70, btnY=BASE_H-GROUND_H-btnH-8;

  // Left button
  const leftPressed = keysHeld.left;
  ctx.globalAlpha = leftPressed ? 0.75 : 0.35;
  ctx.fillStyle = '#ff88cc';
  rrect(10, btnY, btnW, btnH, 16); ctx.fill();
  ctx.globalAlpha = leftPressed ? 1 : 0.6;
  ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'white';
  ctx.fillText('◀', 10+btnW/2, btnY+btnH/2);

  // Right button
  const rightPressed = keysHeld.right;
  ctx.globalAlpha = rightPressed ? 0.75 : 0.35;
  ctx.fillStyle = '#ff88cc';
  rrect(BASE_W-10-btnW, btnY, btnW, btnH, 16); ctx.fill();
  ctx.globalAlpha = rightPressed ? 1 : 0.6;
  ctx.fillText('▶', BASE_W-10-btnW/2, btnY+btnH/2);

  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';

  // Level up flash
  if (lvlDisplay > 0) {
    const a = Math.min(1, lvlDisplay/35);
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = 'bold 56px Arial'; ctx.fillStyle = '#ff44aa';
    ctx.shadowColor = '#ff0088'; ctx.shadowBlur = 28;
    ctx.fillText(`✨ LEVEL ${level}! ✨`, BASE_W/2, BASE_H/2-20);
    ctx.font = 'bold 24px Arial'; ctx.fillStyle = 'white'; ctx.shadowBlur = 10;
    ctx.fillText('Faster sweets!', BASE_W/2, BASE_H/2+18);
    ctx.globalAlpha = 1; lvlDisplay--;
  }

  ctx.restore();
}

// ─── START SCREEN ───────────────────────────────────────────────────────────
function drawStartScreen() {
  drawBackground();
  updateParticles(); drawParticles();
  if (frame%20===0) spawnParticle(Math.random()*BASE_W, Math.random()*BASE_H*0.75, 'sweet');

  // Characters preview
  drawPrincess(BASE_W/2 - 40, GROUND_Y - 98, frame*0.1, false, 0);
  drawCat(BASE_W/2 + 65, GROUND_Y - 50, frame*0.18, false, false);

  // Panel
  const pw=560, ph=230, px=BASE_W/2-pw/2, py=BASE_H-268;
  ctx.fillStyle='rgba(255,238,252,.95)'; rrect(px,py,pw,ph,22); ctx.fill();
  const bc=`hsl(${frame*2%360},80%,68%)`; ctx.strokeStyle=bc; ctx.lineWidth=3; rrect(px,py,pw,ph,22); ctx.stroke();

  ctx.save(); ctx.textAlign='center';
  ctx.font=`bold 40px "Comic Sans MS",Arial`;
  const hue=`hsl(${(frame*2)%360},88%,50%)`;
  ctx.fillStyle=hue; ctx.shadowColor=hue; ctx.shadowBlur=16;
  ctx.fillText("Addie's Sweet World! 🍭", BASE_W/2, py+50+Math.sin(frame*.06)*3);
  ctx.shadowBlur=0;

  ctx.font='bold 18px Arial'; ctx.fillStyle='#cc44aa';
  ctx.fillText('Catch all the falling sweets! 🍫🍬🍰', BASE_W/2, py+88);

  ctx.font='16px Arial'; ctx.fillStyle='#886699';
  ctx.fillText('◀ ▶  Arrow keys  —  or tap left / right side of screen', BASE_W/2, py+116);
  ctx.fillText('Dodge the 🐝 bees!   Catch 🌈 for double points!', BASE_W/2, py+140);

  // Start button
  const p=1+Math.sin(frame*.1)*.06;
  ctx.save(); ctx.translate(BASE_W/2, py+196); ctx.scale(p,p);
  ctx.fillStyle='#ff44aa'; ctx.shadowColor='#ff0080'; ctx.shadowBlur=16;
  rrect(-140,-24,280,48,14); ctx.fill(); ctx.shadowBlur=0;
  ctx.font='bold 22px Arial'; ctx.fillStyle='white';
  ctx.fillText('🍭 Tap or press any key to start! 🍫', 0, 9);
  ctx.restore(); ctx.restore();
}

// ─── GAME OVER SCREEN ───────────────────────────────────────────────────────
function drawGameOverScreen() {
  ctx.fillStyle='rgba(0,0,0,.44)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  const pw=440, ph=310, px=BASE_W/2-pw/2, py=BASE_H/2-ph/2;
  ctx.fillStyle='rgba(255,240,252,.97)'; rrect(px,py,pw,ph,22); ctx.fill();
  ctx.strokeStyle='#ff44aa'; ctx.lineWidth=3.5; rrect(px,py,pw,ph,22); ctx.stroke();
  ctx.save(); ctx.textAlign='center';
  ctx.font='bold 44px Arial'; ctx.fillStyle='#ff2288';
  ctx.shadowColor='#ff0066'; ctx.shadowBlur=16; ctx.fillText('Game Over! 💔', BASE_W/2, py+66);
  ctx.shadowBlur=0; ctx.font='bold 32px Arial'; ctx.fillStyle='#cc2288';
  ctx.fillText(`🍭 Score: ${score}`, BASE_W/2, py+114);
  if (score>0&&score>=highScore) {
    ctx.font='bold 22px Arial'; ctx.fillStyle='#ff44aa'; ctx.shadowColor='#ff0088'; ctx.shadowBlur=12;
    ctx.fillText('🌟 NEW HIGH SCORE! 🌟', BASE_W/2, py+152);
  } else {
    ctx.shadowBlur=0; ctx.font='20px Arial'; ctx.fillStyle='#aa44cc';
    ctx.fillText(`Best: ${highScore}`, BASE_W/2, py+152);
  }
  ctx.shadowBlur=0; ctx.font='18px Arial'; ctx.fillStyle='#886699';
  ctx.fillText(`You reached Level ${level}!`, BASE_W/2, py+186);
  const p2=1+Math.sin(frame*.09)*.055;
  ctx.save(); ctx.translate(BASE_W/2,py+250); ctx.scale(p2,p2);
  ctx.fillStyle='#ff66bb'; ctx.shadowColor='#ff0088'; ctx.shadowBlur=14;
  rrect(-120,-24,240,48,14); ctx.fill();
  ctx.shadowBlur=0; ctx.font='bold 21px Arial'; ctx.fillStyle='white';
  ctx.fillText('Play Again! 🍭', 0, 9);
  ctx.restore(); ctx.restore();
}

// ─── START GAME ─────────────────────────────────────────────────────────────
function startGame() {
  state='playing'; paused=false; score=0; lives=3; level=1; frame=0;
  scoreNext=300; hitCool=0; lvlDisplay=0; speechCool=0;
  items=[]; particles=[]; popups=[];
  itemTimer=0; itemInterval=60;
  keysHeld.left=false; keysHeld.right=false;
  PRINCESS.reset(); CAT.reset();
  melodyIdx=0; melodyTime=audioCtx?audioCtx.currentTime:0;
}

// ─── PAUSE OVERLAY ──────────────────────────────────────────────────────────
function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,220,245,0.72)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 68px "Comic Sans MS", Arial';
  ctx.fillStyle = '#cc2299';
  ctx.shadowColor = '#ff44aa';
  ctx.shadowBlur = 22;
  ctx.fillText('⏸ Paused!', BASE_W / 2, BASE_H / 2 - 28);
  ctx.shadowBlur = 0;
  ctx.font = '22px "Comic Sans MS", Arial';
  ctx.fillStyle = '#883366';
  ctx.fillText('Press P, Escape, or tap ⏸ to resume', BASE_W / 2, BASE_H / 2 + 30);
  ctx.restore();
}

// ─── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,BASE_W,BASE_H);

  if (state==='start') { drawStartScreen(); frame++; return; }

  if (state==='gameover') {
    drawBackground(); updateParticles(); drawParticles();
    CAT.draw(); PRINCESS.draw();
    drawGameOverScreen(); frame++; return;
  }

  if (paused) {
    drawBackground();
    drawItems(); drawParticles();
    CAT.draw(); PRINCESS.draw();
    drawHUD(); updateDrawPopups();
    drawPauseOverlay();
    return;
  }

  // Update
  PRINCESS.update(); CAT.update();
  updateItems(); updateParticles();
  if (hitCool>0) hitCool--;
  scheduleMelody();

  // Draw
  drawBackground();
  drawItems(); drawParticles();
  CAT.draw(); PRINCESS.draw();
  drawHUD(); updateDrawPopups();

  frame++;
}

loop();
</script>
