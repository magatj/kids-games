<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jungle Blaster</title>
  <style>
    :root {
      --bg-top: #081423;
      --bg-mid: #163350;
      --bg-bottom: #2f6a37;
      --panel: rgba(9, 18, 30, 0.85);
      --panel-border: rgba(255, 255, 255, 0.18);
      --sand: #9f7a3d;
      --grass: #65a547;
      --hero-skin: #f2c48f;
      --hero-shirt: #e24036;
      --hero-pants: #3569d1;
      --enemy-main: #ffd149;
      --enemy-dark: #58492b;
      --laser: #ff7045;
      --pickup: #7df0ff;
      --text: #f5f7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 24%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, #12281c 100%);
    }

    .shell {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .brand h1,
    .brand p {
      margin: 0;
    }

    .brand h1 {
      font-size: clamp(2rem, 4vw, 3.3rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand p {
      color: #c8d5ef;
      margin-top: 4px;
    }

    .hud {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      min-width: 110px;
      padding: 10px 14px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .hud-card span {
      display: block;
      font-size: 0.8rem;
      color: #bdd1ff;
    }

    .hud-card strong {
      display: block;
      font-size: 1.9rem;
      margin-top: 2px;
    }

    .hearts {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin-top: 4px;
      font-size: 1.5rem;
      line-height: 1;
    }

    .game-wrap {
      position: relative;
      width: min(100%, 960px);
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      border: 4px solid rgba(255, 255, 255, 0.92);
      background: #0e2031;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: min(100%, 440px);
      padding: 26px 24px;
      text-align: center;
      background: rgba(5, 11, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .panel h2,
    .panel p {
      margin: 0;
    }

    .panel h2 {
      font-size: 2rem;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .panel p {
      margin-top: 10px;
      color: #d8e4ff;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: white;
      cursor: pointer;
      background: linear-gradient(180deg, #ff7b3d, #c63c26);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
    }

    button.secondary {
      background: linear-gradient(180deg, #4c82ff, #2448b7);
    }

    .help {
      width: min(100%, 960px);
      margin: 16px auto 0;
      text-align: center;
      color: #cad8f5;
      line-height: 1.45;
    }

    .help strong {
      color: white;
    }

    .mobile-controls {
      width: min(100%, 960px);
      margin: 16px auto 0;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .control-cluster {
      display: flex;
      gap: 12px;
      align-items: stretch;
      justify-content: center;
    }

    .control-pad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .touch-btn {
      min-height: 88px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(8, 17, 29, 0.9);
      color: white;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.06);
    }

    .touch-btn:active,
    .touch-btn.active {
      transform: translateY(1px);
      background: rgba(47, 95, 185, 0.95);
    }

    .touch-btn.fire {
      background: linear-gradient(180deg, #ff7b3d, #c63c26);
    }

    .touch-btn.jump {
      background: linear-gradient(180deg, #4c82ff, #2448b7);
    }

    .touch-btn.pause {
      min-height: 64px;
      background: linear-gradient(180deg, #64748b, #334155);
    }

    @media (max-width: 640px) {
      .shell {
        padding: 12px;
      }

      .hud-card {
        min-width: 88px;
        padding: 8px 10px;
      }

      .hud-card strong {
        font-size: 1.45rem;
      }

      .mobile-controls {
        grid-template-columns: 1fr;
      }

      .touch-btn {
        min-height: 76px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Jungle Blaster</h1>
        <p>A one-file arcade run-and-gun inspired by classic side-scrollers.</p>
      </div>
      <div class="hud">
        <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
        <div class="hud-card"><span>Health</span><div class="hearts" id="lives"></div></div>
        <div class="hud-card"><span>Wave</span><strong id="wave">1</strong></div>
        <div class="hud-card"><span>Best</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="game-wrap">
      <canvas id="game" width="960" height="540" aria-label="Jungle Blaster game"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="panel">
          <h2>Mission Start</h2>
          <p>Run right, jump over danger, and blast robots before they reach you.</p>
          <p><strong>Move:</strong> A / D or Arrow keys. <strong>Jump:</strong> W, Up, or Space. <strong>Shoot:</strong> J or F.</p>
          <div class="actions">
            <button id="startBtn">Play</button>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="panel">
          <h2 id="endTitle">Game Over</h2>
          <p id="endText">You scored 0 points.</p>
          <div class="actions">
            <button id="restartBtn">Play Again</button>
            <button id="menuBtn" class="secondary">Menu</button>
          </div>
        </div>
      </div>
    </section>


    <section class="mobile-controls">
      <div class="control-cluster">
        <div class="control-pad">
          <button class="touch-btn" id="leftBtn" aria-label="Move left">Left</button>
          <button class="touch-btn" id="rightBtn" aria-label="Move right">Right</button>
        </div>
      </div>
      <div class="control-cluster">
        <button class="touch-btn jump" id="jumpBtn" aria-label="Jump">Jump</button>
        <button class="touch-btn fire" id="shootBtn" aria-label="Shoot">Fire</button>
        <button class="touch-btn pause" id="pauseBtn" aria-label="Pause game">Pause</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const waveEl = document.getElementById("wave");
    const bestEl = document.getElementById("best");
    const startOverlay = document.getElementById("startOverlay");
    const endOverlay = document.getElementById("endOverlay");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const menuBtn = document.getElementById("menuBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const jumpBtn = document.getElementById("jumpBtn");
    const shootBtn = document.getElementById("shootBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_Y = 450;
    const BEST_KEY = "jungle-blaster-best-score";

    const input = {
      left: false,
      right: false,
      jump: false,
      shoot: false
    };

    const state = {
      running: false,
      frame: 0,
      score: 0,
      lives: 3,
      wave: 1,
      cameraX: 0,
      shake: 0,
      flash: 0,
      paused: false,
      stars: [],
      bullets: [],
      enemies: [],
      particles: [],
      pickups: [],
      enemyTimer: 0,
      pickupTimer: 0,
      best: Number(localStorage.getItem(BEST_KEY) || 0),
      hero: {
        x: 140,
        y: GROUND_Y - 74,
        w: 42,
        h: 74,
        vx: 0,
        vy: 0,
        facing: 1,
        onGround: true,
        invuln: 0,
        shootCooldown: 0
      },
      animationFrame: 0
    };

    function initStars() {
      state.stars = Array.from({ length: 50 }, (_, i) => ({
        x: (i * 137) % (WIDTH * 3),
        y: 40 + ((i * 73) % 200),
        r: 1 + (i % 3)
      }));
    }

    function resetGame() {
      state.frame = 0;
      state.score = 0;
      state.lives = 3;
      state.wave = 1;
      state.cameraX = 0;
      state.shake = 0;
      state.flash = 0;
      state.paused = false;
      state.bullets = [];
      state.enemies = [];
      state.particles = [];
      state.pickups = [];
      state.enemyTimer = 60;
      state.pickupTimer = 240;
      state.hero.x = 140;
      state.hero.y = GROUND_Y - state.hero.h;
      state.hero.vx = 0;
      state.hero.vy = 0;
      state.hero.facing = 1;
      state.hero.onGround = true;
      state.hero.invuln = 0;
      state.hero.shootCooldown = 0;
      updateHud();
      pauseBtn.textContent = "Pause";
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      const maxLives = 5;
      livesEl.innerHTML = Array.from({ length: maxLives }, (_, i) =>
        `<span>${i < state.lives ? "❤️" : "🖤"}</span>`
      ).join("");
      waveEl.textContent = state.wave;
      bestEl.textContent = state.best;
    }

    function startGame() {
      resetGame();
      state.running = true;
      state.paused = false;
      startOverlay.classList.add("hidden");
      endOverlay.classList.add("hidden");
      cancelAnimationFrame(state.animationFrame);
      pauseBtn.textContent = "Pause";
      loop();
    }

    function backToMenu() {
      state.running = false;
      state.paused = false;
      endOverlay.classList.add("hidden");
      startOverlay.classList.remove("hidden");
      pauseBtn.textContent = "Pause";
      draw();
    }

    function finishGame(victory) {
      state.running = false;
      state.paused = false;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(BEST_KEY, String(state.best));
      }
      updateHud();
      endTitle.textContent = victory ? "Mission Clear" : "Game Over";
      endText.textContent = victory
        ? `You survived all waves with ${state.score} points.`
        : `You scored ${state.score} points.`;
      endOverlay.classList.remove("hidden");
      pauseBtn.textContent = "Pause";
    }

    function togglePause() {
      if (!state.running) {
        return;
      }

      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? "Resume" : "Pause";

      if (!state.paused) {
        cancelAnimationFrame(state.animationFrame);
        loop();
      } else {
        draw();
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function spawnEnemy() {
      const waveSpeed = 1.6 + state.wave * 0.18;
      const tall = Math.random() < 0.28;
      state.enemies.push({
        x: state.cameraX + WIDTH + Math.random() * 220,
        y: tall ? GROUND_Y - 96 : GROUND_Y - 64,
        w: tall ? 46 : 38,
        h: tall ? 96 : 64,
        vx: -(waveSpeed + Math.random() * 0.8),
        hp: tall ? 3 : 2,
        shootTimer: 70 + Math.random() * 60,
        color: tall ? "#ff9b2f" : "#ffd149"
      });
    }

    function spawnPickup() {
      state.pickups.push({
        x: state.cameraX + WIDTH + 100 + Math.random() * 200,
        y: GROUND_Y - 120 - Math.random() * 80,
        w: 20,
        h: 20,
        bob: Math.random() * Math.PI * 2
      });
    }

    function addExplosion(x, y, color, count) {
      for (let i = 0; i < count; i += 1) {
        state.particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 1.4,
          life: 24 + Math.random() * 18,
          color
        });
      }
    }

    function heroShoot() {
      if (state.hero.shootCooldown > 0) {
        return;
      }

      state.hero.shootCooldown = 10;
      state.bullets.push({
        x: state.hero.x + state.hero.w / 2 + state.hero.facing * 18,
        y: state.hero.y + 28,
        w: 18,
        h: 6,
        vx: state.hero.facing * 9
      });
      addExplosion(state.hero.x + state.hero.w / 2 + state.hero.facing * 16, state.hero.y + 28, "#ffd77d", 4);
    }

    function hurtHero() {
      if (state.hero.invuln > 0) {
        return;
      }

      state.lives -= 1;
      state.hero.invuln = 90;
      state.shake = 14;
      state.flash = 10;
      addExplosion(state.hero.x + state.hero.w / 2, state.hero.y + 30, "#ff6a59", 14);
      updateHud();

      if (state.lives <= 0) {
        finishGame(false);
      }
    }

    function updateHero() {
      const speed = 4.2;

      if (input.left) {
        state.hero.vx = -speed;
        state.hero.facing = -1;
      } else if (input.right) {
        state.hero.vx = speed;
        state.hero.facing = 1;
      } else {
        state.hero.vx *= 0.78;
      }

      if (input.jump && state.hero.onGround) {
        state.hero.vy = -11.5;
        state.hero.onGround = false;
      }

      if (input.shoot) {
        heroShoot();
      }

      state.hero.vy += 0.52;
      state.hero.x += state.hero.vx;
      state.hero.y += state.hero.vy;

      if (state.hero.y + state.hero.h >= GROUND_Y) {
        state.hero.y = GROUND_Y - state.hero.h;
        state.hero.vy = 0;
        state.hero.onGround = true;
      }

      state.hero.x = clamp(state.hero.x, state.cameraX + 70, state.cameraX + WIDTH * 0.55);

      if (state.hero.shootCooldown > 0) {
        state.hero.shootCooldown -= 1;
      }

      if (state.hero.invuln > 0) {
        state.hero.invuln -= 1;
      }
    }

    function updateBullets() {
      for (const bullet of state.bullets) {
        bullet.x += bullet.vx;
      }

      for (const bullet of state.bullets) {
        if (bullet.enemyBullet) {
          continue;
        }

        for (const enemy of state.enemies) {
          if (bullet.dead || enemy.dead) {
            continue;
          }

          if (rectsOverlap(bullet, enemy)) {
            bullet.dead = true;
            enemy.hp -= 1;
            addExplosion(bullet.x, bullet.y, "#fff4a8", 4);
            if (enemy.hp <= 0) {
              enemy.dead = true;
              state.score += 100;
              addExplosion(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#ff9a4c", 18);
              updateHud();
            }
          }
        }
      }

      state.bullets = state.bullets.filter((bullet) => !bullet.dead && bullet.x > state.cameraX - 60 && bullet.x < state.cameraX + WIDTH + 100);
    }

    function updateEnemies() {
      for (const enemy of state.enemies) {
        enemy.x += enemy.vx;
        enemy.shootTimer -= 1;

        if (enemy.shootTimer <= 0 && Math.abs(enemy.x - state.hero.x) < 420) {
          enemy.shootTimer = 90 + Math.random() * 40;
          state.bullets.push({
            x: enemy.x,
            y: enemy.y + enemy.h * 0.45,
            w: 14,
            h: 5,
            vx: -6.5,
            enemyBullet: true
          });
        }

        if (rectsOverlap(enemy, state.hero)) {
          enemy.dead = true;
          hurtHero();
        }
      }

      state.enemies = state.enemies.filter((enemy) => !enemy.dead && enemy.x + enemy.w > state.cameraX - 100);
    }

    function updateEnemyBullets() {
      for (const bullet of state.bullets) {
        if (!bullet.enemyBullet) {
          continue;
        }

        if (rectsOverlap(bullet, state.hero)) {
          bullet.dead = true;
          hurtHero();
        }
      }
    }

    function updatePickups() {
      for (const pickup of state.pickups) {
        pickup.bob += 0.08;
        pickup.y += Math.sin(pickup.bob) * 0.5;
        if (rectsOverlap(pickup, state.hero)) {
          pickup.dead = true;
          state.score += 250;
          state.lives = Math.min(5, state.lives + 1);
          addExplosion(pickup.x, pickup.y, "#7df0ff", 16);
          updateHud();
        }
      }

      state.pickups = state.pickups.filter((pickup) => !pickup.dead && pickup.x + pickup.w > state.cameraX - 40);
    }

    function updateParticles() {
      for (const particle of state.particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.1;
        particle.life -= 1;
      }

      state.particles = state.particles.filter((particle) => particle.life > 0);
    }

    function updateWaves() {
      state.enemyTimer -= 1;
      state.pickupTimer -= 1;

      if (state.enemyTimer <= 0) {
        spawnEnemy();
        state.enemyTimer = Math.max(36, 95 - state.wave * 7);
      }

      if (state.pickupTimer <= 0) {
        spawnPickup();
        state.pickupTimer = 320 + Math.random() * 180;
      }

      if (state.score >= state.wave * 1200 && state.wave < 5) {
        state.wave += 1;
        state.flash = 10;
        updateHud();
      }

      if (state.score >= 6000) {
        finishGame(true);
      }
    }

    function updateCamera() {
      state.cameraX += 1.4 + state.wave * 0.15;
      const minHeroX = state.cameraX + 70;
      if (state.hero.x < minHeroX) {
        state.hero.x = minHeroX;
      }
    }

    function update() {
      if (!state.running) {
        return;
      }

      if (state.paused) {
        return;
      }

      state.frame += 1;
      updateCamera();
      updateHero();
      updateBullets();
      updateEnemies();
      updateEnemyBullets();
      updatePickups();
      updateParticles();
      updateWaves();

      if (state.shake > 0) {
        state.shake -= 1;
      }

      if (state.flash > 0) {
        state.flash -= 1;
      }
    }

    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      grad.addColorStop(0, "#091523");
      grad.addColorStop(0.6, "#1b4568");
      grad.addColorStop(1, "#3a8137");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = "rgba(255,255,255,0.8)";
      for (const star of state.stars) {
        const x = ((star.x - state.cameraX * 0.18) % (WIDTH + 200)) - 100;
        ctx.beginPath();
        ctx.arc(x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(30, 48, 67, 0.55)";
      for (let i = 0; i < 6; i += 1) {
        const x = ((i * 220) - (state.cameraX * 0.35 % 220)) - 40;
        ctx.fillRect(x, 170, 120, 180);
        ctx.fillRect(x + 28, 120, 64, 230);
      }

      ctx.fillStyle = "#25452d";
      for (let i = 0; i < 8; i += 1) {
        const x = ((i * 160) - (state.cameraX * 0.7 % 160)) - 30;
        ctx.fillRect(x, 260, 26, 190);
        ctx.beginPath();
        ctx.arc(x + 13, 250, 34, Math.PI, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGround() {
      ctx.fillStyle = "#456c28";
      ctx.fillRect(0, GROUND_Y - 18, WIDTH, HEIGHT - GROUND_Y + 18);
      ctx.fillStyle = "#9a7740";
      ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);

      ctx.fillStyle = "#6d4d26";
      for (let i = 0; i < 18; i += 1) {
        const x = ((i * 70) - (state.cameraX * 1.4 % 70)) - 10;
        ctx.fillRect(x, GROUND_Y + 18, 34, 6);
      }
    }

    function drawHero() {
      const hero = state.hero;
      const blink = hero.invuln > 0 && Math.floor(hero.invuln / 5) % 2 === 0;
      if (blink) {
        return;
      }

      ctx.save();
      ctx.translate(hero.x - state.cameraX, hero.y);
      if (hero.facing < 0) {
        ctx.translate(hero.w, 0);
        ctx.scale(-1, 1);
      }

      ctx.fillStyle = "#3f2813";
      ctx.fillRect(12, 10, 16, 16);

      ctx.fillStyle = "#f2c48f";
      ctx.fillRect(12, 14, 14, 12);

      ctx.fillStyle = "#e24036";
      ctx.fillRect(8, 28, 24, 20);

      ctx.fillStyle = "#3569d1";
      ctx.fillRect(10, 48, 9, 20);
      ctx.fillRect(21, 48, 9, 20);

      ctx.fillStyle = "#1f1f1f";
      ctx.fillRect(28, 30, 18, 6);
      ctx.fillRect(26, 32, 6, 4);
      ctx.fillRect(12, 68, 8, 6);
      ctx.fillRect(22, 68, 8, 6);

      ctx.restore();
    }

    function drawEnemy(enemy) {
      ctx.save();
      ctx.translate(enemy.x - state.cameraX, enemy.y);
      ctx.fillStyle = enemy.color;
      ctx.fillRect(0, 0, enemy.w, enemy.h);
      ctx.fillStyle = "#2b2e3f";
      ctx.fillRect(6, 8, enemy.w - 12, 14);
      ctx.fillStyle = "#e1462d";
      ctx.fillRect(8, enemy.h - 18, enemy.w - 16, 10);
      ctx.restore();
    }

    function drawBullet(bullet) {
      ctx.fillStyle = bullet.enemyBullet ? "#ff3f7a" : "#ffef8c";
      ctx.fillRect(bullet.x - state.cameraX, bullet.y, bullet.w, bullet.h);
    }

    function drawPickup(pickup) {
      ctx.save();
      ctx.translate(pickup.x - state.cameraX, pickup.y);
      ctx.fillStyle = "#7df0ff";
      ctx.fillRect(0, 0, pickup.w, pickup.h);
      ctx.fillStyle = "white";
      ctx.fillRect(7, 3, 6, 14);
      ctx.fillRect(3, 7, 14, 6);
      ctx.restore();
    }

    function drawParticles() {
      for (const particle of state.particles) {
        ctx.globalAlpha = particle.life / 42;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x - state.cameraX, particle.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function drawCrosshair() {
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.beginPath();
      ctx.moveTo(WIDTH * 0.55, 0);
      ctx.lineTo(WIDTH * 0.55, HEIGHT);
      ctx.stroke();
    }

    function draw() {
      const shakeX = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
      const shakeY = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;

      ctx.save();
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.translate(shakeX, shakeY);

      drawSky();
      drawGround();
      drawCrosshair();

      for (const pickup of state.pickups) {
        drawPickup(pickup);
      }

      for (const enemy of state.enemies) {
        drawEnemy(enemy);
      }

      for (const bullet of state.bullets) {
        drawBullet(bullet);
      }

      drawHero();
      drawParticles();
      ctx.restore();

      if (state.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${state.flash / 24})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      if (state.paused) {
        ctx.fillStyle = "rgba(5, 11, 20, 0.55)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 42px Trebuchet MS";
        ctx.fillText("PAUSED", WIDTH / 2, HEIGHT / 2);
      }
    }

    function loop() {
      update();
      draw();

      if (state.running && !state.paused) {
        state.animationFrame = requestAnimationFrame(loop);
      }
    }

    function setInput(event, pressed) {
      const key = event.key.toLowerCase();
      if (key === "a" || key === "arrowleft") {
        input.left = pressed;
      }
      if (key === "d" || key === "arrowright") {
        input.right = pressed;
      }
      if (key === "w" || key === "arrowup" || key === " ") {
        input.jump = pressed;
      }
      if (key === "j" || key === "f") {
        input.shoot = pressed;
      }
    }

    document.addEventListener("keydown", (event) => {
      setInput(event, true);
      if ([" ", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
      }
      if (event.key.toLowerCase() === "p") {
        event.preventDefault();
        togglePause();
      }
    });

    document.addEventListener("keyup", (event) => {
      setInput(event, false);
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
    menuBtn.addEventListener("click", backToMenu);
    pauseBtn.addEventListener("click", togglePause);

    function bindTouchButton(button, onPress, onRelease) {
      const press = (event) => {
        event.preventDefault();
        button.classList.add("active");
        onPress();
      };

      const release = (event) => {
        event.preventDefault();
        button.classList.remove("active");
        onRelease();
      };

      button.addEventListener("pointerdown", press);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointerleave", release);
      button.addEventListener("pointercancel", release);
    }

    bindTouchButton(leftBtn, () => { input.left = true; }, () => { input.left = false; });
    bindTouchButton(rightBtn, () => { input.right = true; }, () => { input.right = false; });
    bindTouchButton(jumpBtn, () => { input.jump = true; }, () => { input.jump = false; });
    bindTouchButton(shootBtn, () => { input.shoot = true; }, () => { input.shoot = false; });

    initStars();
    updateHud();
    draw();
  </script>
</body>
</html>
